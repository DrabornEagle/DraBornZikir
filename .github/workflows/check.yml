name: Expo Go source checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx expo export --platform android --output-dir /tmp/dkd-expo-export
        env:
          EXPO_OFFLINE: '1'
      - run: node scripts/check-expo-go-bundle.cjs /tmp/dkd-expo-export
