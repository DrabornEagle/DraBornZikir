name: DraBornZikir v0.3 Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'package.json'
      - 'package-lock.json'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/release-apk.yml'

concurrency:
  group: drabornzikir-v03-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      DKD_ANDROID_KEYSTORE_BASE64: ${{ secrets.DKD_ANDROID_KEYSTORE_BASE64 }}
      DKD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DKD_ANDROID_KEYSTORE_PASSWORD }}
      DKD_ANDROID_KEY_ALIAS: ${{ secrets.DKD_ANDROID_KEY_ALIAS }}
      DKD_ANDROID_KEY_PASSWORD: ${{ secrets.DKD_ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Require permanent release signing secrets
        shell: bash
        run: |
          test -n "$DKD_ANDROID_KEYSTORE_BASE64" || { echo 'Missing DKD_ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$DKD_ANDROID_KEYSTORE_PASSWORD" || { echo 'Missing DKD_ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$DKD_ANDROID_KEY_ALIAS" || { echo 'Missing DKD_ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$DKD_ANDROID_KEY_PASSWORD" || { echo 'Missing DKD_ANDROID_KEY_PASSWORD'; exit 1; }

      - name: Install JS dependencies
        run: npm ci

      - name: Validate v0.3 release identity
        run: |
          node - <<'NODE'
          const a=require('./app.json').expo;
          if(a.version!=='0.3.0') throw new Error(`Expected app version 0.3.0, got ${a.version}`);
          if(Number(a.android.versionCode)!==1) throw new Error(`Expected Android versionCode 1, got ${a.android.versionCode}`);
          if(a.android.package!=='com.draborneagle.drabornzikir') throw new Error('Android package mismatch');
          if(a.androidNavigationBar?.backgroundColor!=='#00000000') throw new Error('Navigation bar is not transparent');
          if(a.androidNavigationBar?.enforceContrast!==false) throw new Error('Navigation contrast must be disabled');
          NODE

      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Generate v0.3 zikir icon assets
        run: |
          python -m pip install --quiet pillow
          python scripts/generate_icons.py

      - name: Restore permanent release keystore
        shell: bash
        run: |
          mkdir -p /tmp/dkd-signing
          python - <<'PY'
          import base64, hashlib, os, re
          raw = os.environ['DKD_ANDROID_KEYSTORE_BASE64'].strip()
          prefix = 'DKD_ANDROID_KEYSTORE_BASE64='
          if raw.startswith(prefix):
              raw = raw[len(prefix):]
          raw = raw.strip().strip('"').strip("'")
          raw = raw.replace('\\n', '').replace('\\r', '')
          raw = ''.join(raw.split())
          raw = re.sub(r'[^A-Za-z0-9+/=]', '', raw)
          payload = raw.rstrip('=')
          raw = payload + ('=' * ((4 - len(payload) % 4) % 4))
          data = base64.b64decode(raw, validate=True)
          expected = '49aa18fb1a18d72143af908245d8eaef90aaafbada52a00337c42936ddef364f'
          actual = hashlib.sha256(data).hexdigest()
          print(f'Permanent signing payload decoded: {len(data)} bytes')
          if len(data) != 4484 or actual != expected:
              raise SystemExit(f'Permanent keystore checksum mismatch: decoded_bytes={len(data)} sha256={actual}')
          with open('/tmp/dkd-signing/release.jks', 'wb') as f:
              f.write(data)
          print('Permanent keystore SHA256 verified')
          PY
          keytool -list -keystore /tmp/dkd-signing/release.jks -storepass "$DKD_ANDROID_KEYSTORE_PASSWORD" -alias "$DKD_ANDROID_KEY_ALIAS" >/dev/null

      - name: Prepare Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Force transparent Android system navigation
        shell: bash
        run: |
          python scripts/patch_android_navigation.py
          grep -R 'android:navigationBarColor.*transparent' android/app/src/main/res/values/styles.xml
          grep -R 'isNavigationBarContrastEnforced = false\|setNavigationBarContrastEnforced(false)' android/app/src/main/java

      - name: Inject permanent release keystore
        shell: bash
        run: |
          mkdir -p android/app/dkd_secure
          cp /tmp/dkd-signing/release.jks android/app/dkd_secure/dkd_release_keystore.jks
          cat > android/app/dkd_release_signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  dkdRelease {
                      storeFile file('dkd_secure/dkd_release_keystore.jks')
                      storePassword System.getenv('DKD_ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('DKD_ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('DKD_ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.dkdRelease } }
          }
          GRADLE
          printf '\napply from: "dkd_release_signing.gradle"\n' >> android/app/build.gradle
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\n' >> android/gradle.properties

      - name: Build signed release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify and collect APK
        shell: bash
        run: |
          mkdir -p release-output
          APK_PATH="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" release-output/DraBornZikir-v0.3.0-code1-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose release-output/DraBornZikir-v0.3.0-code1-release.apk
          sha256sum release-output/DraBornZikir-v0.3.0-code1-release.apk | tee release-output/SHA256.txt
          printf 'Signing mode: permanent-repository-secret\nKeystore SHA256: 49aa18fb1a18d72143af908245d8eaef90aaafbada52a00337c42936ddef364f\nAndroid navigation: native transparent + contrast disabled\n' > release-output/SIGNING.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DraBornZikir_v0_3_0_Signed_Release_APK
          path: release-output/
          retention-days: 30
