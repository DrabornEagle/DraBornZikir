name: DraBornZikir v0.2 Signed Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.json'
      - 'package.json'
      - 'src/**'
      - 'scripts/**'
      - '.github/workflows/release-apk.yml'

concurrency:
  group: drabornzikir-v02-release
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    env:
      CI: '1'
      EXPO_NO_TELEMETRY: '1'
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
      DKD_ANDROID_KEYSTORE_BASE64: ${{ secrets.DKD_ANDROID_KEYSTORE_BASE64 }}
      DKD_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DKD_ANDROID_KEYSTORE_PASSWORD }}
      DKD_ANDROID_KEY_ALIAS: ${{ secrets.DKD_ANDROID_KEY_ALIAS }}
      DKD_ANDROID_KEY_PASSWORD: ${{ secrets.DKD_ANDROID_KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JS dependencies
        run: npm ci

      - name: Validate v0.2 release identity
        run: |
          node - <<'NODE'
          const a=require('./app.json').expo;
          if(a.version!=='0.2.0') throw new Error(`Expected app version 0.2.0, got ${a.version}`);
          if(Number(a.android.versionCode)!==2) throw new Error(`Expected Android versionCode 2, got ${a.android.versionCode}`);
          if(a.android.package!=='com.draborneagle.drabornzikir') throw new Error('Android package mismatch');
          NODE

      - name: Typecheck and lint
        run: |
          npm run typecheck
          npm run lint

      - name: Generate v0.2 zikir icon assets
        run: |
          python -m pip install --quiet pillow
          python scripts/generate_icons.py

      - name: Prepare release signing key
        id: signing
        shell: bash
        run: |
          mkdir -p /tmp/dkd-signing
          if [ -n "$DKD_ANDROID_KEYSTORE_BASE64" ] && [ -n "$DKD_ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$DKD_ANDROID_KEY_ALIAS" ] && [ -n "$DKD_ANDROID_KEY_PASSWORD" ]; then
            printf '%s' "$DKD_ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/dkd-signing/release.jks
            keytool -list -keystore /tmp/dkd-signing/release.jks -storepass "$DKD_ANDROID_KEYSTORE_PASSWORD" -alias "$DKD_ANDROID_KEY_ALIAS" >/dev/null
            echo 'mode=repository-secret' >> "$GITHUB_OUTPUT"
          else
            PASS="$(openssl rand -hex 20)"
            ALIAS="drabornzikir-v02"
            keytool -genkeypair -v -keystore /tmp/dkd-signing/release.jks -storepass "$PASS" -keypass "$PASS" -alias "$ALIAS" -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=DraBornZikir, OU=DraBornEagle, O=DraBornEagle, L=Antalya, ST=Antalya, C=TR"
            echo "DKD_ANDROID_KEYSTORE_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "DKD_ANDROID_KEY_PASSWORD=$PASS" >> "$GITHUB_ENV"
            echo "DKD_ANDROID_KEY_ALIAS=$ALIAS" >> "$GITHUB_ENV"
            echo 'mode=generated-fallback' >> "$GITHUB_OUTPUT"
          fi
          test -s /tmp/dkd-signing/release.jks

      - name: Prepare Android SDK
        shell: bash
        run: |
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Inject release keystore
        shell: bash
        run: |
          mkdir -p android/app/dkd_secure
          cp /tmp/dkd-signing/release.jks android/app/dkd_secure/dkd_release_keystore.jks
          cat > android/app/dkd_release_signing.gradle <<'GRADLE'
          android {
              signingConfigs {
                  dkdRelease {
                      storeFile file('dkd_secure/dkd_release_keystore.jks')
                      storePassword System.getenv('DKD_ANDROID_KEYSTORE_PASSWORD')
                      keyAlias System.getenv('DKD_ANDROID_KEY_ALIAS')
                      keyPassword System.getenv('DKD_ANDROID_KEY_PASSWORD')
                  }
              }
              buildTypes { release { signingConfig signingConfigs.dkdRelease } }
          }
          GRADLE
          printf '\napply from: "dkd_release_signing.gradle"\n' >> android/app/build.gradle
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8\norg.gradle.daemon=false\n' >> android/gradle.properties

      - name: Build signed release APK
        run: |
          cd android
          ./gradlew :app:assembleRelease --no-daemon

      - name: Verify and collect APK
        shell: bash
        run: |
          mkdir -p release-output
          APK_PATH="$(find android/app/build/outputs/apk/release -type f -name '*.apk' | head -n 1)"
          test -n "$APK_PATH"
          cp "$APK_PATH" release-output/DraBornZikir-v0.2.0-code2-release.apk
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose release-output/DraBornZikir-v0.2.0-code2-release.apk
          sha256sum release-output/DraBornZikir-v0.2.0-code2-release.apk | tee release-output/SHA256.txt
          printf 'Signing mode: %s\n' '${{ steps.signing.outputs.mode }}' > release-output/SIGNING.txt

      - uses: actions/upload-artifact@v4
        with:
          name: DraBornZikir_v0_2_0_Signed_Release_APK
          path: release-output/
          retention-days: 30
